# Render Service definition - safe to include in repo (no secrets)
# See https://render.com/docs/render-yaml for more details
services:
  - name: ransomwrite
    type: web
    env: docker
    branch: main
    plan: starter
    disk: 1024
    repo: madal3ne/ransomwrite
    buildCommand: ''
    startCommand: "gunicorn -w ${GUNICORN_WORKERS:-4} -b 0.0.0.0:${PORT:-5000} app:app"
    envVars:
      - key: ITEM_MAX_CHARS
        value: '200'
      - key: MAX_CONTENT_LENGTH
        value: '1000000'
      - key: DEFAULT_RATE_LIMIT
        value: '60 per minute'
      - key: API_RENDER_LIMIT
        value: '30 per minute'
      - key: EXPORT_LIMIT
        value: '5 per minute'
    services:
      - type: web
        protocol: http
        internalPort: 5000
