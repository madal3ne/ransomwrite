<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters Processed</title>
    <style>
        .space { display:inline-block; width:20px; }
        .missing { display:inline-block; padding:4px 6px; border:1px dashed #aaa; background:#f9f9f9; font-weight:bold; color:#c00; margin-right:6px; }
        img.letter { margin-right:6px; height:72px; }
    </style>
</head>
<body>
    <h2>User Input: {{ user_input }}</h2>
{% if letter_images %}
    <div>
        {% for item in letter_images %}
            {% if item.type == 'image' %}
                <img class="letter" src="{{ item.src }}" alt="Letter Image">
            {% elif item.type == 'space' %}
                <span class="space"></span>
            {% elif item.type == 'missing' %}
                <span class="missing">[{{ item.char }}]</span>
            {% endif %}
        {% endfor %}
    </div>
{% else %}
    <p>No images found for the entered text.</p>
{% endif %}
</body>
</html>
